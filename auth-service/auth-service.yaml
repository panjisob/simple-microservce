---
apiVersion: v1
kind: Service
metadata:
  name: auth-service-v1
  namespace: local-dev
  labels:
    app: auth-service-v1
    app.kubernetes.io/component: auth-service-v1
    app.kubernetes.io/instance: auth-service-v1
spec:
  ipFamilies:
    - IPv4
  selector:
    app: auth-service-v1
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: LoadBalancer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-v1
  namespace: local-dev
  labels:
    app: auth-service-v1
    app.kubernetes.io/component: auth-service-v1
    app.kubernetes.io/instance: auth-service-v1
data:
  SERVER_PORT: '8080'
  SERVER_SERVLET_CONTEXT_PATH: '/api/authservice'
  REDIS_HOST: 'host.docker.internal'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service-v1
  namespace: local-dev
  labels:
    app: auth-service-v1
    app.kubernetes.io/component: auth-service-v1
    app.kubernetes.io/instance: auth-service-v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service-v1
  template:
    metadata:
      name: auth-service-v1
      labels:
        app: auth-service-v1
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "kubernetes.io/hostname"
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: auth-service-v1
      containers:
        - name: auth-service-v1
          image: localhost:5000/auth-service:0.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: auth-service-v1
          resources:
            requests:
              memory: "800Mi"
              cpu: "500m"
            limits:
              memory: "2048Mi"
              cpu: "2000m"

      